name: CI Pipeline

on:
  push:
    branches: [ "main", "feature/**", "chore/**", "bugfix/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-test:
    name: Code Quality & Security Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: guardrail_admin
          POSTGRES_PASSWORD: change_me_securely
          POSTGRES_DB: guardrail_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 📦 Install Backend & Dev Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff mypy pytest pytest-asyncio pytest-cov

      - name: 🔍 Ruff Linter & Code Style Check
        run: |
          ruff check backend/

      - name: 🛡️ Secret & Hardcoding Check
        run: |
          # Check for accidental .env or hardcoded raw passwords in commit
          if git grep -i "AQ\.Ab8RN6JTKJpWJLhxryiyXfcDa" .; then
            echo "❌ Hardcoded API key pattern detected!"
            exit 1
          fi
          if [ -f .env ]; then
            echo "❌ .env file must not be present in repository!"
            exit 1
          fi
          echo "✅ Secret scan passed without issues."

      - name: 🧪 Run Pytest Test Suite with Coverage
        env:
          ENVIRONMENT: test
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: guardrail_admin
          POSTGRES_PASSWORD: change_me_securely
          POSTGRES_DB: guardrail_db
        run: |
          pytest -v --cov=backend/app --cov-report=term-missing backend/tests/

      - name: 🐳 Validate Docker Compose Configuration
        run: |
          docker compose config --quiet
          echo "✅ Docker Compose configuration is valid."
