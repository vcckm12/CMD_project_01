[project]
name = "ai-guardrail-backend"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"
cache-dir = "/tmp/ruff-cache"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
# S101: pytest asserts. S608: SQL built only from constant column names in tests.
per-file-ignores = { "tests/*" = ["S101", "S608", "S105", "S106", "E501"], "app/guardrails/ruleset.py" = ["E501"], "app/api/ops.py" = ["S608"] }  # rule table: one regex per line; ops.py: WHERE built from fixed column names, values bound

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
