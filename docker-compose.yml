# Production stack (DES-001 §2). Only Nginx publishes ports; added in a later step.
name: ${COMPOSE_PROJECT_NAME:-ag_prod}

services:
  postgres:
    image: postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      AG_OWNER_PASSWORD: ${AG_OWNER_PASSWORD:?set in .env}
      AG_DB_NAME: ${AG_DB_NAME:-ai_guardrail}
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deployment/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${AG_DB_NAME:-ai_guardrail}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [app]

  migrate:
    build: { context: ./backend, target: runtime }
    command: ["python", "-m", "app.db.migrate"]
    environment:
      MIGRATION_DATABASE_URL: postgresql://ag_owner:${AG_OWNER_PASSWORD}@postgres:5432/${AG_DB_NAME:-ai_guardrail}
      AG_AUTH_PASSWORD: ${AG_AUTH_PASSWORD:?}
      AG_CHAT_PASSWORD: ${AG_CHAT_PASSWORD:?}
      AG_RULES_PASSWORD: ${AG_RULES_PASSWORD:?}
      AG_AUDIT_READER_PASSWORD: ${AG_AUDIT_READER_PASSWORD:?}
      AG_AUDIT_WORKER_PASSWORD: ${AG_AUDIT_WORKER_PASSWORD:?}
      AG_MAINTENANCE_PASSWORD: ${AG_MAINTENANCE_PASSWORD:?}
      AG_RETENTION_PASSWORD: ${AG_RETENTION_PASSWORD:?}
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"
    networks: [app]

  # Integration tests against the real database: docker compose run --rm db-test
  db-test:
    build: { context: ./backend, target: dev }
    profiles: [test]
    command: ["pytest", "-q", "-p", "no:cacheprovider", "tests"]
    environment:
      TEST_DB_HOST: postgres
      TEST_DB_NAME: ${AG_DB_NAME:-ai_guardrail}
      TEST_SUPERUSER_PASSWORD: ${POSTGRES_PASSWORD}
      TEST_OWNER_PASSWORD: ${AG_OWNER_PASSWORD}
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [app]

volumes:
  pgdata:

networks:
  app:
    internal: true
