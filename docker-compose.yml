# Production stack (DES-001 §2). Only Nginx publishes ports; added in a later step.
name: ${COMPOSE_PROJECT_NAME:-ag_prod}  # tests use ag_test (scripts/test.sh)

services:
  postgres:
    image: postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      AG_OWNER_PASSWORD: ${AG_OWNER_PASSWORD:?set in .env}
      AG_DB_NAME: ${AG_DB_NAME:-ai_guardrail}
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deployment/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${AG_DB_NAME:-ai_guardrail}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [app]

  migrate:
    build: { context: ./backend, target: runtime }
    command: ["python", "-m", "app.db.migrate"]
    environment:
      MIGRATION_DATABASE_URL: postgresql://ag_owner:${AG_OWNER_PASSWORD}@postgres:5432/${AG_DB_NAME:-ai_guardrail}
      AG_AUTH_PASSWORD: ${AG_AUTH_PASSWORD:?}
      AG_CHAT_PASSWORD: ${AG_CHAT_PASSWORD:?}
      AG_RULES_PASSWORD: ${AG_RULES_PASSWORD:?}
      AG_AUDIT_READER_PASSWORD: ${AG_AUDIT_READER_PASSWORD:?}
      AG_AUDIT_WORKER_PASSWORD: ${AG_AUDIT_WORKER_PASSWORD:?}
      AG_MAINTENANCE_PASSWORD: ${AG_MAINTENANCE_PASSWORD:?}
      AG_RETENTION_PASSWORD: ${AG_RETENTION_PASSWORD:?}
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"
    networks: [app]

  api:
    build: { context: ./backend, target: runtime }
    command: ["uvicorn", "app.main:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000",
              "--workers", "1", "--proxy-headers", "--forwarded-allow-ips", "*", "--no-server-header"]
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      GUARDRAIL_ENFORCED: "true"
      AUTH_DATABASE_URL: postgresql://ag_auth:${AG_AUTH_PASSWORD}@postgres:5432/${AG_DB_NAME:-ai_guardrail}
      CHAT_DATABASE_URL: postgresql://ag_chat:${AG_CHAT_PASSWORD}@postgres:5432/${AG_DB_NAME:-ai_guardrail}
      RULES_DATABASE_URL: postgresql://ag_rules:${AG_RULES_PASSWORD}@postgres:5432/${AG_DB_NAME:-ai_guardrail}
      JWT_PRIVATE_KEY_FILE: /run/secrets/jwt_private_key
      SHOP_ORIGIN: ${SHOP_ORIGIN:-https://shop.example.internal}
      OPS_ORIGIN: ${OPS_ORIGIN:-https://ops.example.internal}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      OLLAMA_MODEL: ${OLLAMA_MODEL}
      OLLAMA_MODEL_DIGEST: ${OLLAMA_MODEL_DIGEST}
      INPUT_FINGERPRINT_KEY: ${INPUT_FINGERPRINT_KEY:?set in .env}
    secrets: [jwt_private_key]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
    depends_on:
      migrate: { condition: service_completed_successfully }
    # `model` is the only network with a route out of Docker, used for the shared Ollama server (D-22).
    networks: [app, model]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTPS_PORT:-443}:443"
    environment:
      SHOP_HOST: ${SHOP_HOST:-shop.example.internal}
      OPS_HOST: ${OPS_HOST:-ops.example.internal}
      OPS_ALLOW_CIDR: ${OPS_ALLOW_CIDR:-10.10.70.0/24}
    volumes:
      - ./deployment/nginx/templates:/etc/nginx/templates:ro
      - ./secrets/tls/server.crt:/etc/nginx/tls/server.crt:ro
      - ./secrets/tls/server.key:/etc/nginx/tls/server.key:ro
      - ./frontend/shop:/usr/share/nginx/shop:ro
    depends_on:
      api: { condition: service_healthy }
    # `edge` publishes 443; `app` reaches the API and Streamlit.
    networks: [edge, app]

  audit-worker:
    build: { context: ./backend, target: runtime }
    command: ["python", "-m", "app.workers.audit_worker"]
    restart: unless-stopped
    environment:
      AUDIT_WORKER_DATABASE_URL: postgresql://ag_audit_worker:${AG_AUDIT_WORKER_PASSWORD}@postgres:5432/${AG_DB_NAME:-ai_guardrail}
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(time.time()-os.path.getmtime('/tmp/audit-worker.heartbeat') > 30)"]
      interval: 15s
      timeout: 5s
      retries: 4
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [app]

  scheduler:
    build: { context: ./backend, target: runtime }
    command: ["python", "-m", "app.workers.scheduler"]
    restart: unless-stopped
    environment:
      MAINTENANCE_DATABASE_URL: postgresql://ag_maintenance:${AG_MAINTENANCE_PASSWORD}@postgres:5432/${AG_DB_NAME:-ai_guardrail}
      RETENTION_DATABASE_URL: postgresql://ag_retention:${AG_RETENTION_PASSWORD}@postgres:5432/${AG_DB_NAME:-ai_guardrail}
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(time.time()-os.path.getmtime('/tmp/scheduler.heartbeat') > 180)"]
      interval: 30s
      timeout: 5s
      retries: 4
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [app]

  # Integration tests against the real database: docker compose --profile test run --rm db-test
  db-test:
    build: { context: ./backend, target: dev }
    profiles: [test]
    command: ["pytest", "-q", "-p", "no:cacheprovider", "tests"]
    volumes:
      - ./datasets:/datasets:ro
    environment:
      TEST_DB_HOST: postgres
      TEST_DB_NAME: ${AG_DB_NAME:-ai_guardrail}
      TEST_SUPERUSER_PASSWORD: ${POSTGRES_PASSWORD}
      TEST_OWNER_PASSWORD: ${AG_OWNER_PASSWORD}
      TEST_AUTH_PASSWORD: ${AG_AUTH_PASSWORD}
      TEST_CHAT_PASSWORD: ${AG_CHAT_PASSWORD}
      TEST_RULES_PASSWORD: ${AG_RULES_PASSWORD}
      TEST_AUDIT_WORKER_PASSWORD: ${AG_AUDIT_WORKER_PASSWORD}
      TEST_MAINTENANCE_PASSWORD: ${AG_MAINTENANCE_PASSWORD}
      TEST_RETENTION_PASSWORD: ${AG_RETENTION_PASSWORD}
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [app]

secrets:
  jwt_private_key:
    file: ./secrets/jwt_private.pem

volumes:
  pgdata:

networks:
  app:
    internal: true
  model: {}
  edge: {}
